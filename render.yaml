# Blueprint Render : API NestJS (apps/api).
# La base PostgreSQL et le stockage des fichiers sont chez Supabase ; le site (apps/web) reste sur Vercel.
#
# Utilisation : Render > New > Blueprint > choisir ce dépôt. Render demande les
# variables marquées `sync: false` (à saisir une seule fois, jamais commitées).

services:
  - type: web
    name: moncode-api
    runtime: node
    region: frankfurt # même région que la base
    # Gratuit. L'API s'endort après 15 min sans requête et met ~30 s à se réveiller.
    # Pour la garder toujours allumée : plan: starter (payant).
    plan: free
    rootDir: apps/api
    # Le dépôt est un monorepo npm : on installe depuis la racine, puis on bâtit l'API
    # (le script `build` génère aussi le client Prisma). `--include=dev` : NODE_ENV=production
    # ferait sinon sauter les outils de build (nest, prisma, ts-node).
    # Le plan gratuit n'a pas de « preDeployCommand » : la mise à jour des tables (db:push) et le
    # réalignement du compte admin sur ADMIN_EMAIL / ADMIN_PASSWORD (seed, idempotent) se font
    # donc à la fin du build.
    buildCommand: npm install --include=dev --prefix=../.. && npm run build && npm run db:push && npm run seed
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Base Supabase (Project Settings > Database > Connection string).
      # DATABASE_URL : « Transaction pooler » (port 6543, avec ?pgbouncer=true) pour l'API.
      # DIRECT_URL : « Session pooler » (port 5432) pour `prisma db push`.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Signature des sessions : générée par Render, stable d'un déploiement à l'autre.
      - key: AUTH_SECRET
        generateValue: true

      # Adresse publique du SITE sur Vercel, avec https:// et sans barre finale.
      # Elle sert aux CORS et aux liens des QR codes.
      - key: APP_URL
        sync: false
      # Adresse publique de CETTE API (https://moncode-api.onrender.com, ou votre
      # domaine). Elle sert aux URL des fichiers envoyés.
      - key: API_URL
        sync: false

      # Compte administrateur créé par le seed.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Paiement en ligne FedaPay (facultatif : sans clé, repli sur WhatsApp + « Encaisser »).
      - key: FEDAPAY_ENV
        value: live
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_WEBHOOK_SECRET
        sync: false

      # Notifications e-mail des demandes visiteurs (facultatif)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Supabase Storage : fichiers envoyés (bucket public « cards »). Obligatoire sur Render,
      # dont le disque est effacé à chaque déploiement.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: cards
